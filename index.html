<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Sound Engine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
            position: relative;
        }

        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 0;
            display: flex;
            gap: 8px;
            background: #1a1a1a;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .lang-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: #888888;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .lang-btn:active {
            transform: scale(0.95);
        }

        .lang-btn.active {
            background: #c9b299;
            color: #000000;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            filter: brightness(1.1);
        }

        .app-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: #999999;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* STATUS */
        .status-bar {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 32px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4),
                        0 -1px 0 rgba(201,178,153,0.2) inset,
                        0 2px 0 rgba(201,178,153,0.3);
        }

        .status-text {
            font-size: 14px;
            color: #888888;
        }

        .status-text.active {
            color: #c9b299;
            font-weight: 600;
        }

        /* VOLUME CONTROL */
        .volume-control {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4),
                        0 -1px 0 rgba(201,178,153,0.2) inset,
                        0 2px 0 rgba(201,178,153,0.3);
        }

        .volume-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #c9b299;
        }

        .volume-value {
            font-weight: 600;
            color: #ffffff;
        }

        .volume-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #2a2a2a;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #c9b299;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(201,178,153,0.5);
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #c9b299;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(201,178,153,0.5);
        }

        /* TIMER */
        .timer-control {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4),
                        0 -1px 0 rgba(201,178,153,0.2) inset,
                        0 2px 0 rgba(201,178,153,0.3);
        }

        .timer-label {
            font-size: 14px;
            color: #c9b299;
            margin-bottom: 12px;
        }

        .timer-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .timer-input-group {
            flex: 1;
        }

        .timer-input-label {
            font-size: 12px;
            color: #888888;
            margin-bottom: 6px;
            display: block;
        }

        .timer-input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
        }

        .timer-input:focus {
            outline: none;
            border-color: #c9b299;
        }

        .timer-status {
            margin-top: 12px;
            font-size: 13px;
            color: #888888;
            text-align: center;
        }

        .timer-status.active {
            color: #c9b299;
        }

        /* BUTTONS */
        .modes-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mode-button {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3),
                        0 -1px 0 rgba(201,178,153,0.15) inset,
                        0 2px 0 rgba(201,178,153,0.25);
            position: relative;
        }

        .mode-button:active {
            transform: scale(0.98);
        }

        .mode-button.active {
            background: #c9b299;
            color: #000000;
            border-color: #c9b299;
            box-shadow: 0 6px 20px rgba(201,178,153,0.4),
                        0 -1px 0 rgba(255,255,255,0.3) inset,
                        0 2px 0 rgba(0,0,0,0.2);
        }

        .mode-button.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .mode-icon {
            font-size: 24px;
            width: 32px;
            text-align: center;
        }

        .mode-info {
            flex: 1;
        }

        .mode-name {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .mode-description {
            font-size: 12px;
            opacity: 0.7;
        }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(201,178,153,0.2);
            border-top-color: #c9b299;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* STOP BUTTON */
        .stop-button {
            background: #c9b299;
            border: none;
            border-radius: 12px;
            padding: 18px;
            color: #000000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(201,178,153,0.4);
        }

        .stop-button.visible {
            opacity: 1;
            pointer-events: all;
        }

        .stop-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <img src="logo.png" alt="Logo" class="logo">
            <div class="app-title" data-i18n="title">TEMPLE SOUND ENGINE</div>
        </div>

        <!-- STATUS -->
        <div class="status-bar">
            <div class="status-text" id="statusText" data-i18n="selectState">Выберите состояние</div>
        </div>

        <!-- VOLUME CONTROL -->
        <div class="volume-control">
            <div class="volume-label">
                <span data-i18n="volume">Громкость</span>
                <span class="volume-value" id="volumeValue">80%</span>
            </div>
            <input type="range" min="0" max="100" value="80" class="volume-slider" id="volumeSlider">
        </div>

        <!-- TIMER -->
        <div class="timer-control">
            <div class="timer-label" data-i18n="timer">Таймер отключения</div>
            <div class="timer-inputs">
                <div class="timer-input-group">
                    <label class="timer-input-label" data-i18n="hours">Часы</label>
                    <input type="number" min="0" max="23" value="0" class="timer-input" id="timerHours">
                </div>
                <div class="timer-input-group">
                    <label class="timer-input-label" data-i18n="minutes">Минуты</label>
                    <input type="number" min="0" max="59" value="0" class="timer-input" id="timerMinutes">
                </div>
            </div>
            <div class="timer-status" id="timerStatus"></div>
        </div>

        <!-- MODES -->
        <div class="modes-container">
            <button class="mode-button" data-mode="delta">
                <div class="mode-icon">🌙</div>
                <div class="mode-info">
                    <div class="mode-name" data-i18n="mode.delta.name">Глубокий сон</div>
                    <div class="mode-description" data-i18n="mode.delta.desc">0.5-4 Гц • Delta волны</div>
                </div>
            </button>

            <button class="mode-button" data-mode="theta">
                <div class="mode-icon">🧘</div>
                <div class="mode-info">
                    <div class="mode-name" data-i18n="mode.theta.name">Медитация</div>
                    <div class="mode-description" data-i18n="mode.theta.desc">4-8 Гц • Theta волны + Шуман</div>
                </div>
            </button>

            <button class="mode-button" data-mode="alpha">
                <div class="mode-icon">🌊</div>
                <div class="mode-info">
                    <div class="mode-name" data-i18n="mode.alpha.name">Расслабление</div>
                    <div class="mode-description" data-i18n="mode.alpha.desc">8-14 Гц • Alpha волны</div>
                </div>
            </button>

            <button class="mode-button" data-mode="beta">
                <div class="mode-icon">⚡</div>
                <div class="mode-info">
                    <div class="mode-name" data-i18n="mode.beta.name">Фокус и работа</div>
                    <div class="mode-description" data-i18n="mode.beta.desc">14-30 Гц • Beta волны</div>
                </div>
            </button>

            <button class="mode-button" data-mode="gamma">
                <div class="mode-icon">✨</div>
                <div class="mode-info">
                    <div class="mode-name" data-i18n="mode.gamma.name">Ясность</div>
                    <div class="mode-description" data-i18n="mode.gamma.desc">30-100 Гц • Gamma волны</div>
                </div>
            </button>
        </div>

        <!-- STOP BUTTON -->
        <button class="stop-button" id="stopButton" data-i18n="stop">Остановить</button>
    </div>

    <!-- LOADING -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- AUDIO ENGINE -->
    <script src="audio.js"></script>

    <script>
        // TRANSLATIONS
        const translations = {
            ru: {
                title: "TEMPLE SOUND ENGINE",
                selectState: "Выберите состояние",
                playingState: "Играет",
                stop: "Остановить",
                volume: "Громкость",
                timer: "Таймер отключения",
                hours: "Часы",
                minutes: "Минуты",
                timerSet: "Таймер установлен на",
                timerOff: "Таймер выключен",
                mode: {
                    delta: { name: "Глубокий сон", desc: "0.5-4 Гц • Delta волны" },
                    theta: { name: "Медитация", desc: "4-8 Гц • Theta волны + Шуман" },
                    alpha: { name: "Расслабление", desc: "8-14 Гц • Alpha волны" },
                    beta: { name: "Фокус и работа", desc: "14-30 Гц • Beta волны" },
                    gamma: { name: "Ясность", desc: "30-100 Гц • Gamma волны" }
                }
            },
            en: {
                title: "TEMPLE SOUND ENGINE",
                selectState: "Select state",
                playingState: "Playing",
                stop: "Stop",
                volume: "Volume",
                timer: "Sleep timer",
                hours: "Hours",
                minutes: "Minutes",
                timerSet: "Timer set for",
                timerOff: "Timer off",
                mode: {
                    delta: { name: "Deep Sleep", desc: "0.5-4 Hz • Delta waves" },
                    theta: { name: "Meditation", desc: "4-8 Hz • Theta waves + Schumann" },
                    alpha: { name: "Relaxation", desc: "8-14 Hz • Alpha waves" },
                    beta: { name: "Focus & Work", desc: "14-30 Hz • Beta waves" },
                    gamma: { name: "Clarity", desc: "30-100 Hz • Gamma waves" }
                }
            }
        };

        let currentLang = 'ru';

        // Language switching
        function initLanguage() {
            const langButtons = document.querySelectorAll('.lang-btn');
            langButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentLang = btn.dataset.lang;
                    langButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateTranslations();
                });
            });
            updateTranslations();
        }

        function updateTranslations() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                const keys = key.split('.');
                let value = t;
                keys.forEach(k => value = value[k]);
                el.textContent = value;
            });
        }

        // Initialize Telegram WebApp
        let tg = null;
        if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        } else {
            tg = {
                initDataUnsafe: {},
                ready: () => {},
                expand: () => {},
                setHeaderColor: () => {},
                setBackgroundColor: () => {},
                HapticFeedback: { 
                    impactOccurred: () => {},
                    notificationOccurred: () => {}
                },
                BackButton: { 
                    onClick: () => {}, 
                    show: () => {}, 
                    hide: () => {} 
                },
                close: () => {},
                showAlert: (msg) => alert(msg)
            };
            console.log('Running in browser mode');
        }

        // State management
        let currentMode = null;
        let isPlaying = false;
        let timerTimeout = null;

        const statusText = document.getElementById('statusText');
        const stopButton = document.getElementById('stopButton');
        const loading = document.getElementById('loading');
        const modeButtons = document.querySelectorAll('.mode-button');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const timerHours = document.getElementById('timerHours');
        const timerMinutes = document.getElementById('timerMinutes');
        const timerStatus = document.getElementById('timerStatus');

        // Volume control
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            volumeValue.textContent = `${e.target.value}%`;
            
            if (window.TempleAudio && typeof window.TempleAudio.setVolume === 'function') {
                window.TempleAudio.setVolume(volume);
            }
        });

        // Timer control
        function updateTimerStatus() {
            const hours = parseInt(timerHours.value) || 0;
            const minutes = parseInt(timerMinutes.value) || 0;
            const t = translations[currentLang];
            
            if (hours === 0 && minutes === 0) {
                timerStatus.textContent = '';
                timerStatus.classList.remove('active');
            } else {
                const totalMinutes = hours * 60 + minutes;
                timerStatus.textContent = `${t.timerSet} ${hours}ч ${minutes}м`;
                timerStatus.classList.add('active');
            }
        }

        timerHours.addEventListener('input', updateTimerStatus);
        timerMinutes.addEventListener('input', updateTimerStatus);

        function startTimer() {
            if (timerTimeout) {
                clearTimeout(timerTimeout);
                timerTimeout = null;
            }

            const hours = parseInt(timerHours.value) || 0;
            const minutes = parseInt(timerMinutes.value) || 0;
            const totalMs = (hours * 60 + minutes) * 60 * 1000;

            if (totalMs > 0) {
                timerTimeout = setTimeout(() => {
                    stopMode();
                }, totalMs);
            }
        }

        // Start mode
        function startMode(mode) {
            if (isPlaying) return;

            loading.classList.add('visible');

            setTimeout(() => {
                loading.classList.remove('visible');

                if (window.TempleAudio && typeof window.TempleAudio.start === 'function') {
                    try {
                        window.TempleAudio.start(mode);
                        const volume = volumeSlider.value / 100;
                        window.TempleAudio.setVolume(volume);
                        console.log('Audio started for mode:', mode);
                    } catch(err) {
                        console.error('Error starting audio:', err);
                        tg.showAlert('Error starting audio');
                        return;
                    }
                } else {
                    console.error('TempleAudio not found');
                    tg.showAlert('Audio engine not loaded');
                    return;
                }

                currentMode = mode;
                isPlaying = true;
                
                const activeButton = document.querySelector(`[data-mode="${mode}"]`);
                const modeName = activeButton.querySelector('.mode-name').textContent;
                
                const t = translations[currentLang];
                statusText.textContent = `${t.playingState}: ${modeName}`;
                statusText.classList.add('active');

                modeButtons.forEach(btn => {
                    if (btn.dataset.mode === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.add('disabled');
                    }
                });

                stopButton.classList.add('visible');

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                updateBackButton();
                startTimer();
            }, 300);
        }

        // Stop mode
        function stopMode() {
            if (!isPlaying) return;

            if (timerTimeout) {
                clearTimeout(timerTimeout);
                timerTimeout = null;
            }

            if (window.TempleAudio && typeof window.TempleAudio.stop === 'function') {
                try {
                    window.TempleAudio.stop();
                    console.log('Audio stopped');
                } catch(err) {
                    console.error('Error stopping audio:', err);
                }
            }

            isPlaying = false;
            currentMode = null;

            const t = translations[currentLang];
            statusText.textContent = t.selectState;
            statusText.classList.remove('active');

            modeButtons.forEach(btn => {
                btn.classList.remove('active', 'disabled');
            });

            stopButton.classList.remove('visible');

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            updateBackButton();
        }

        // Mode buttons
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const mode = button.dataset.mode;
                startMode(mode);
            });
        });

        // Stop button
        stopButton.addEventListener('click', stopMode);

        // Handle back button
        if (tg && tg.BackButton) {
            tg.BackButton.onClick(() => {
                if (isPlaying) {
                    stopMode();
                } else {
                    tg.close();
                }
            });
        }

        // Show/hide back button
        function updateBackButton() {
            if (tg && tg.BackButton) {
                if (isPlaying) {
                    tg.BackButton.show();
                } else {
                    tg.BackButton.hide();
                }
            }
        }

        // Initialize app
        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            console.log('Temple Sound Engine initialized');
            console.log('TempleAudio available:', typeof window.TempleAudio !== 'undefined');
        });
    </script>
</body>
</html>
